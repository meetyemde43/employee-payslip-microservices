<!DOCTYPE html>
<html>

<head>
    <title>Attendance System</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            margin-top: 50px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 85%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 12px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        h3 {
            color: green;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Add Attendance</h2>

    <input type="number"
           id="empId"
           placeholder="Employee ID">

    <input type="number"
           id="days"
           placeholder="Days Attended">

    <br><br>

    <button onclick="addAttendance()">
        Add Attendance
    </button>

    <h3 id="msg"></h3>

</div>

<script>

function addAttendance() {

    const attendance = {

        empId:
        document.getElementById(
            "empId"
        ).value,

        daysAttended:
        document.getElementById(
            "days"
        ).value
    };

    fetch(
      "http://localhost:8082/attendance/add",

    {
        method: "POST",

        headers: {
            "Content-Type":
            "application/json"
        },

        body:
        JSON.stringify(attendance)
    })

    .then(response =>
        response.text()
    )

    .then(data => {

        document.getElementById(
            "msg"
        ).innerHTML = data;
    })

    .catch(error => {

        document.getElementById(
            "msg"
        ).innerHTML =
        "Error Adding Attendance";
    });
}

</script>

</body>

</html>
